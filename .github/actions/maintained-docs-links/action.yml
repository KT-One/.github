name: Validate maintained Markdown links
description: Check relative Markdown links in an explicit list of existing repository files
inputs:
  files:
    description: Newline-separated paths to maintained Markdown entrypoints
    required: true
runs:
  using: composite
  steps:
    - name: Validate maintained Markdown entrypoints
      shell: bash
      env:
        DOC_LINK_FILES: ${{ inputs.files }}
      run: |
        python3 - <<'PY'
        import os
        import re
        import sys
        from pathlib import Path
        from urllib.parse import unquote

        files = [line.strip() for line in os.environ["DOC_LINK_FILES"].splitlines() if line.strip()]
        problems = []
        root = Path.cwd().resolve()
        for name in files:
            file = Path(name)
            if not file.is_file():
                problems.append(f"{name}: missing source")
                continue
            for link in re.findall(r"\[[^\]]+\]\(([^)]+)\)", file.read_text()):
                target = link.split("#", 1)[0]
                if not target or re.match(r"^(?:https?:|mailto:)", target):
                    continue
                candidate = (file.parent / unquote(target)).resolve()
                if not candidate.is_relative_to(root):
                    problems.append(f"{name}: link escapes repository: {target}")
                elif not candidate.exists():
                    problems.append(f"{name}: missing {target}")
        if problems:
            print("\n".join(problems), file=sys.stderr)
            sys.exit(1)
        print(f"Validated {len(files)} maintained Markdown entrypoints")
        PY
